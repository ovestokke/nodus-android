name: Android CI and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    if: github.repository == 'ovestokke/nodus-android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test release version mapping
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin

      - name: Archive debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nodus-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.repository == 'ovestokke/nodus-android' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.NODUS_RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.NODUS_RELEASE_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.NODUS_RELEASE_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NODUS_RELEASE_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Derive Android version from tag
        id: version
        run: python3 .github/scripts/android_release_version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing NODUS_RELEASE_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing NODUS_RELEASE_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing NODUS_RELEASE_KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing NODUS_RELEASE_KEY_ALIAS}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/nodus-release.jks
          chmod 600 app/nodus-release.jks
          keytool -list \
            -keystore app/nodus-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pkeystore=nodus-release.jks \
            -Pstorepass="$STORE_PASSWORD" \
            -Pkeypass="$KEY_PASSWORD" \
            -Pkeyalias="$KEY_ALIAS" \
            -PnodusVersionName="${{ steps.version.outputs.name }}" \
            -PnodusVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          apk="nodus-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gzip -c app/build/outputs/mapping/release/mapping.txt > "mapping-${{ steps.version.outputs.name }}.txt.gz"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Remove signing key
        if: always()
        run: rm -f app/nodus-release.jks

      - name: Publish GitHub release for Obtainium
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.assets.outputs.apk }}"
          assets=("$apk" "$apk.sha256" "mapping-${{ steps.version.outputs.name }}.txt.gz")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Nodus Android ${{ steps.version.outputs.name }}" \
              --repo "$GITHUB_REPOSITORY"
          fi
