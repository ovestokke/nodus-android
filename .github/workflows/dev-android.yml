name: Android development build

on:
  push:
    branches:
      - 'dev-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ovestokke/nodus-android'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin

      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nodus-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
